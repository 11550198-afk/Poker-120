<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>撲克牌湊 120 · 括號算術 | Poker 120 · Bracket Math</title>
  <!-- Tailwind CSS for responsive layout -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Nunito, Noto Sans TC, and JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet" />

  <style>
    /* ==========================================================================
       WARM SUNLIT TABLETOP PUZZLE THEME
       Background: #FAF8F5 | Cards: #FFFFFF | Indigo: #4F46E5
       Parentheses Highlight: #D97706 (Warm Amber) | Success: #059669 (Emerald)
       ========================================================================== */
    body {
      font-family: 'Nunito', 'Noto Sans TC', sans-serif;
      background-color: #FAF8F5;
      background-image:
        radial-gradient(circle at 12% 10%, rgba(79, 70, 229, 0.06) 0%, transparent 38%),
        radial-gradient(circle at 88% 15%, rgba(217, 119, 6, 0.07) 0%, transparent 40%),
        radial-gradient(circle at 50% 92%, rgba(5, 150, 105, 0.06) 0%, transparent 45%);
      color: #1E293B;
      min-height: 100vh;
    }

    .font-math {
      font-family: 'JetBrains Mono', monospace;
    }

    /* Crisp Sunlit Panels */
    .table-panel {
      background: #FFFFFF;
      border: 2px solid #EFECE6;
      box-shadow: 0 8px 24px -6px rgba(30, 41, 59, 0.06);
    }

    /* Standard 52-Card Playing Cards */
    .playing-card {
      background: #FFFFFF;
      border: 2.5px solid #E2E8F0;
      border-radius: 20px;
      box-shadow:
        0 8px 18px rgba(15, 23, 42, 0.06),
        0 4px 0 #CBD5E1;
      transition:
        transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1),
        border-color 0.18s ease,
        box-shadow 0.18s ease,
        opacity 0.18s ease;
      user-select: none;
      cursor: pointer;
    }

    .playing-card:hover:not(.is-used) {
      transform: translateY(-6px) scale(1.02);
      border-color: #4F46E5;
      box-shadow:
        0 14px 24px rgba(79, 70, 229, 0.16),
        0 5px 0 #4338CA;
    }

    .playing-card:active:not(.is-used) {
      transform: translateY(-1px) scale(0.98);
    }

    /* Card already placed into the equation bar */
    .playing-card.is-used {
      background: #F8FAFC;
      border-color: #CBD5E1;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.03);
      opacity: 0.56;
      transform: translateY(2px) scale(0.97);
    }

    .playing-card.is-used.is-last-token {
      opacity: 0.82;
      border-color: #818CF8;
    }

    .playing-card.is-used.is-last-token:hover {
      opacity: 1;
      transform: translateY(-2px);
    }

    /* Tactile Keypad Buttons */
    .key-btn {
      transition: transform 0.12s ease, box-shadow 0.12s ease, background-color 0.15s ease, opacity 0.15s ease;
      user-select: none;
    }
    .key-btn:active:not(:disabled) {
      transform: translateY(2px);
    }
    .key-btn:disabled {
      opacity: 0.38;
      cursor: not-allowed;
    }

    /* Subtle pulse on operator keys if user taps 2 cards in a row */
    @keyframes opNudge {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    .nudge-op {
      animation: opNudge 0.35s ease-in-out 2;
    }

    /* Deal & Token Pop Animations */
    @keyframes cardDeal {
      0% { opacity: 0; transform: translateY(-16px) scale(0.92); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    .anim-deal {
      animation: cardDeal 0.26s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes tokenPop {
      0% { opacity: 0; transform: scale(0.75); }
      100% { opacity: 1; transform: scale(1); }
    }
    .anim-token {
      animation: tokenPop 0.16s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    @keyframes cursorBlink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    .eq-cursor {
      animation: cursorBlink 1s infinite;
    }
  </style>
</head>
<body class="antialiased selection:bg-amber-200 selection:text-slate-900">

  <!-- Celebration Confetti Canvas -->

  <!-- Main Centered Responsive Container -->

  <!-- ==========================================================================
       APPLICATION LOGIC: 52-CARD DECK, BRACKET PARSER, EXACT SOLVER
       ========================================================================== -->
  <script>
    // Snapshot clean HTML prior to dynamic DOM rendering for offline download
    const CLEAN_HTML_SNAPSHOT = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;

    /* ------------------------------------------------------------------------
       1. BILINGUAL DICTIONARY (繁體中文 / English)
       ------------------------------------------------------------------------ */
    const I18N = {
      zh: {
        title: '撲克牌湊 120 · 括號算術',
        subtitle: '不含鬼牌 52 張 · A=1, J=11, Q=12, K=13',
        deckLabel: '牌堆:',
        solvedLabel: '已完成:',
        download: '下載離線版 (.html)',
        countLabel: '抽牌張數 (Cards)',
        cardUnit: '張',
        targetLabel: '目標結果 (Target)',
        random: '隨機目標',
        deal: '發牌 (New Deal)',

    /* ------------------------------------------------------------------------
       2. APPLICATION STATE
       ------------------------------------------------------------------------ */
    const state = {
      lang: 'zh',
      cardCount: 5,
      target: 120,
      solvedCount: 0,
      autoShowSolutions: false,
      solutionsVisible: false,

      deck: [],
      dealtCards: [],     // Current hand of cards
      tokens: [],         // Array of { type: 'card' | 'op' | 'lparen' | 'rparen', ... }
      roundSolved: false,

    /* ------------------------------------------------------------------------
       3. EXACT RATIONAL ARITHMETIC (FRACTIONS)
       ------------------------------------------------------------------------ */
    function gcd(a, b) {
      a = Math.abs(a);
      b = Math.abs(b);
      while (b !== 0) {
        const t = b;
        b = a % b;
        a = t;
      }
      return a;
    }

    function frac(n, d = 1) {
      if (d === 0) return null;
      if (d < 0) { n = -n; d = -d; }
      if (n === 0) return { n: 0, d: 1 };
      const g = gcd(n, d);
      return { n: n / g, d: d / g };
    }

    function addFrac(a, b) { return frac(a.n * b.d + b.n * a.d, a.d * b.d); }
    function subFrac(a, b) { return frac(a.n * b.d - b.n * a.d, a.d * b.d); }
    function mulFrac(a, b) { return frac(a.n * b.n, a.d * b.d); }
    function divFrac(a, b) { return b.n === 0 ? null : frac(a.n * b.d, a.d * b.n); }

    function formatFrac(f) {
      if (!f) return '?';
      return f.d === 1 ? String(f.n) : `${f.n}/${f.d}`;
    }

    function matchesTarget(f, target) {
      if (!f) return false;
      if (Number.isInteger(target)) return f.d === 1 && f.n === target;
      return Math.abs(f.n / f.d - target) < 1e-9;
    }

    /* ------------------------------------------------------------------------
       4. REAL-TIME RECURSIVE DESCENT PARSER WITH BRACKET BREAKDOWN
       ------------------------------------------------------------------------ */
    function countOpenParens(tokens) {
      let open = 0;
      for (const tk of tokens) {
        if (tk.type === 'lparen') open++;
        else if (tk.type === 'rparen') open--;
      }
      return open;
    }

    /**
     * Evaluates balanced token list with exact rational math AND records every
     * parenthesized sub-expression `( ... )` in bottom-up evaluation order.
     */
    function evaluateTokensWithBreakdown(tokens) {
      if (tokens.length === 0) return { status: 'EMPTY' };
      const open = countOpenParens(tokens);
      if (open > 0) return { status: 'UNCLOSED', open };

      const last = tokens[tokens.length - 1];
      if (last.type !== 'card' && last.type !== 'rparen') {
        return { status: 'INCOMPLETE' };
      }

      let pos = 0;
      let divZero = false;
      const groups = []; // { expr: '(13 − 8)', val: frac(5,1), valStr: '5' }

      function parseExpr() {
        let left = parseTerm();
        while (pos < tokens.length && tokens[pos].type === 'op' && (tokens[pos].op === '+' || tokens[pos].op === '-')) {
          const opTok = tokens[pos++];
          const right = parseTerm();
          if (divZero || !left || !right) return null;
          const val = opTok.op === '+' ? addFrac(left.val, right.val) : subFrac(left.val, right.val);
          left = {
            val,
            text: `${left.text} ${opTok.symbol} ${right.text}`
          };
        }
        return left;
      }

      function parseTerm() {
        let left = parseFactor();
        while (pos < tokens.length && tokens[pos].type === 'op' && (tokens[pos].op === '*' || tokens[pos].op === '/')) {
          const opTok = tokens[pos++];
          const right = parseFactor();
          if (divZero || !left || !right) return null;
          let val = null;
          if (opTok.op === '*') {
            val = mulFrac(left.val, right.val);
          } else {
            if (right.val.n === 0) {
              divZero = true;
              return null;
            }
            val = divFrac(left.val, right.val);
          }
          left = {
            val,
            text: `${left.text} ${opTok.symbol} ${right.text}`
          };
        }
        return left;
      }

      function parseFactor() {
        if (pos >= tokens.length) return null;
        const tk = tokens[pos];
        if (tk.type === 'card') {
          pos++;
          return {
            val: frac(tk.value, 1),
            text: String(tk.value)
          };
        }
        if (tk.type === 'lparen') {
          pos++; // consume '('
          const inner = parseExpr();
          if (pos < tokens.length && tokens[pos].type === 'rparen') {
            pos++; // consume ')'
          }
          if (!inner || divZero) return null;
          const wrappedText = `(${inner.text})`;
          groups.push({
            expr: wrappedText,
            val: inner.val,
            valStr: formatFrac(inner.val)
          });
          return {
            val: inner.val,
            text: wrappedText
          };
        }
        return null;
      }

      const result = parseExpr();
      if (divZero) return { status: 'DIV_ZERO' };
      if (!result || pos !== tokens.length) return { status: 'INCOMPLETE' };

      return {
        status: 'OK',
        val: result.val,
        valStr: formatFrac(result.val),
        fullText: result.text,
        groups
      };
    }

    /* ------------------------------------------------------------------------
       5. BACKGROUND EXACT-RATIONAL SOLVER (UP TO 15 DISTINCT SOLUTIONS)
       ------------------------------------------------------------------------ */
    const FACTORIAL_PAIRS_120 = [
      [5, 24],
      [6, 20],
      [8, 15],
      [10, 12]
    ];

    function is120FactorPair(x, y) {
      if (x.d !== 1 || y.d !== 1) return false;
      for (const [p, q] of FACTORIAL_PAIRS_120) {
        if ((x.n === p && y.n === q) || (x.n === q && y.n === p)) return true;
      }
      return false;
    }

    function solveHand(numbers, target, limit = 15) {
      const uniqueMap = new Map();
      const deadStates = new Set();
      let visited = 0;
      const maxNodes = numbers.length >= 6 ? 32000 : 55000;

      const startNodes = numbers.map((num) => ({
        f: frac(num, 1),
        expr: String(num),
        prec: 3, // 3 = atom/grouped, 2 = * or /, 1 = + or -
        addTerms: [String(num)],
        mulTerms: [String(num)],
        canon: String(num),
        isFactorialSplit: false,
        nonIntSteps: 0
      }));

      function search(nodes) {
        if (uniqueMap.size >= limit) return true;
        if (visited++ > maxNodes) return uniqueMap.size > 0;

        if (nodes.length === 1) {
          const last = nodes[0];
          if (matchesTarget(last.f, target)) {
            if (!uniqueMap.has(last.canon)) {
              uniqueMap.set(last.canon, {
                expr: last.expr,
                isFactorialSplit: last.isFactorialSplit,
                nonIntSteps: last.nonIntSteps
              });
            }
            return true;
          }
          return false;
        }

        const key = nodes.map((nd) => `${nd.f.n}/${nd.f.d}`).sort().join(',');
        if (deadStates.has(key)) return false;

        let found = false;
        const len = nodes.length;

        for (let i = 0; i < len; i++) {
          for (let j = i + 1; j < len; j++) {
            const a = nodes[i];
            const b = nodes[j];
            const rest = [];
            for (let k = 0; k < len; k++) {
              if (k !== i && k !== j) rest.push(nodes[k]);
            }

            const candidates = [];

            // Addition (commutative)
            {
              const f = addFrac(a.f, b.f);
              const terms = [...a.addTerms, ...b.addTerms].sort();
              const canon = `+(${terms.join(',')})`;
              candidates.push({
                f,
                expr: `${a.expr} + ${b.expr}`,
                prec: 1,
                addTerms: terms,
                mulTerms: [canon],
                canon,
                isFactorialSplit: a.isFactorialSplit || b.isFactorialSplit,
                nonIntSteps: a.nonIntSteps + b.nonIntSteps + (f.d !== 1 ? 1 : 0)
              });
            }

            // Multiplication (commutative)
            {
              const f = mulFrac(a.f, b.f);
              const terms = [...a.mulTerms, ...b.mulTerms].sort();
              const canon = `*(${terms.join(',')})`;
              const isFact = target === 120 && f.d === 1 && f.n === 120 && is120FactorPair(a.f, b.f);
              // Wrap compound operands in parentheses for crystal-clear bracket reading
              const wrapL = a.prec < 2 || (isFact && a.prec === 2);
              const wrapR = b.prec < 2 || (isFact && b.prec === 2);
              const L = wrapL ? `(${a.expr})` : a.expr;
              const R = wrapR ? `(${b.expr})` : b.expr;
              candidates.push({
                f,
                expr: `${L} × ${R}`,
                prec: 2,
                addTerms: [canon],
                mulTerms: terms,
                canon,
                isFactorialSplit: a.isFactorialSplit || b.isFactorialSplit || isFact,
                nonIntSteps: a.nonIntSteps + b.nonIntSteps + (f.d !== 1 ? 1 : 0)
              });
            }

            // Subtraction: a - b
            {
              const f = subFrac(a.f, b.f);
              const canon = `-(${a.canon},${b.canon})`;
              const R = b.prec <= 1 ? `(${b.expr})` : b.expr;
              candidates.push({
                f,
                expr: `${a.expr} − ${R}`,
                prec: 1,
                addTerms: [canon],
                mulTerms: [canon],
                canon,
                isFactorialSplit: a.isFactorialSplit || b.isFactorialSplit,
                nonIntSteps: a.nonIntSteps + b.nonIntSteps + (f.d !== 1 ? 1 : 0)
              });
            }

            // Subtraction: b - a
            if (a.f.n !== b.f.n || a.f.d !== b.f.d) {
              const f = subFrac(b.f, a.f);
              const canon = `-(${b.canon},${a.canon})`;
              const R = a.prec <= 1 ? `(${a.expr})` : a.expr;
              candidates.push({
                f,
                expr: `${b.expr} − ${R}`,
                prec: 1,
                addTerms: [canon],
                mulTerms: [canon],
                canon,
                isFactorialSplit: a.isFactorialSplit || b.isFactorialSplit,
                nonIntSteps: a.nonIntSteps + b.nonIntSteps + (f.d !== 1 ? 1 : 0)
              });
            }

            // Division: a / b
            if (b.f.n !== 0) {
              const f = divFrac(a.f, b.f);
              if (f) {
                const canon = `/(${a.canon},${b.canon})`;
                const L = a.prec < 2 ? `(${a.expr})` : a.expr;
                const R = b.prec <= 2 ? `(${b.expr})` : b.expr;
                candidates.push({
                  f,
                  expr: `${L} ÷ ${R}`,
                  prec: 2,
                  addTerms: [canon],
                  mulTerms: [canon],
                  canon,
                  isFactorialSplit: a.isFactorialSplit || b.isFactorialSplit,
                  nonIntSteps: a.nonIntSteps + b.nonIntSteps + (f.d !== 1 ? 1 : 0)
                });
              }
            }

            // Division: b / a
            if (a.f.n !== 0 && (a.f.n !== b.f.n || a.f.d !== b.f.d)) {
              const f = divFrac(b.f, a.f);
              if (f) {
                const canon = `/(${b.canon},${a.canon})`;
                const L = b.prec < 2 ? `(${b.expr})` : b.expr;
                const R = a.prec <= 2 ? `(${a.expr})` : a.expr;
                candidates.push({
                  f,
                  expr: `${L} ÷ ${R}`,
                  prec: 2,
                  addTerms: [canon],
                  mulTerms: [canon],
                  canon,
                  isFactorialSplit: a.isFactorialSplit || b.isFactorialSplit,
                  nonIntSteps: a.nonIntSteps + b.nonIntSteps + (f.d !== 1 ? 1 : 0)
                });
              }
            }

            for (const cand of candidates) {
              if (Math.abs(cand.f.n) > 1e8 || cand.f.d > 1e6) continue;
              if (search([...rest, cand])) {
                found = true;
                if (uniqueMap.size >= limit) return true;
              }
            }
          }
        }

        if (!found && visited < maxNodes) deadStates.add(key);
        return found;
      }

      search(startNodes);

      // Sort 5! factorial splits first, then integer-only equations, then shortest
      return Array.from(uniqueMap.values()).sort((a, b) => {
        if (a.isFactorialSplit !== b.isFactorialSplit) return a.isFactorialSplit ? -1 : 1;
        if (a.nonIntSteps !== b.nonIntSteps) return a.nonIntSteps - b.nonIntSteps;
        return a.expr.length - b.expr.length;
      });
    }

    /* ------------------------------------------------------------------------
       6. STANDARD 52-CARD DECK (NO JOKERS) & SOLVABLE HAND GENERATOR
       ------------------------------------------------------------------------ */
    function createShuffledDeck() {
      const suits = [
        { symbol: '♠', color: 'slate' },
        { symbol: '♥', color: 'rose' },
        { symbol: '♦', color: 'amber' },
        { symbol: '♣', color: 'emerald' }
      ];
      const ranks = [
        { rank: 'A', val: 1 },
        { rank: '2', val: 2 },
        { rank: '3', val: 3 },
        { rank: '4', val: 4 },
        { rank: '5', val: 5 },
        { rank: '6', val: 6 },
        { rank: '7', val: 7 },
        { rank: '8', val: 8 },
        { rank: '9', val: 9 },
        { rank: '10', val: 10 },
        { rank: 'J', val: 11 },
        { rank: 'Q', val: 12 },
        { rank: 'K', val: 13 }
      ];

      const cards = [];
      let uid = 1;
      for (const s of suits) {
        for (const r of ranks) {
          cards.push({ uid: uid++, suit: s.symbol, color: s.color, rank: r.rank, val: r.val });
        }
      }
      return shuffle(cards);
    }

    function shuffle(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function dealNewCards() {
      hideFeedback();
      state.tokens = [];
      state.roundSolved = false;
      state.hintStep = 0;

      // Reshuffle full 52-card deck when fewer cards remain than needed
      if (state.deck.length < state.cardCount) {
        state.deck = createShuffledDeck();
      }

      let chosenHand = null;
      let nextDeck = null;
      let foundSolutions = [];

      for (let attempt = 0; attempt < 65; attempt++) {
        const pool = state.deck.length >= state.cardCount ? shuffle(state.deck) : createShuffledDeck();
        const hand = pool.slice(0, state.cardCount);
        const rest = pool.slice(state.cardCount);
        const sols = solveHand(hand.map((c) => c.val), state.target, 15);

        chosenHand = hand;
        nextDeck = rest;
        foundSolutions = sols;
        if (sols.length > 0) break;
      }

      state.deck = nextDeck;
      state.dealtCards = chosenHand;
      state.solutions = foundSolutions;
      state.solutionsVisible = state.autoShowSolutions;

      render();
    }

    /* ------------------------------------------------------------------------
       7. INTERACTIVE EQUATION BUILDER & SMART BRACKET RULES
       ------------------------------------------------------------------------ */
    function isCardUsed(cardIndex) {
      return state.tokens.some((tk) => tk.type === 'card' && tk.cardIndex === cardIndex);
    }

    function onCardClick(cardIndex) {
      if (state.roundSolved) return;
      const last = state.tokens[state.tokens.length - 1];

      // If card is already used:
      if (isCardUsed(cardIndex)) {
        // If it's the very last token, tapping it removes it cleanly!
        if (last && last.type === 'card' && last.cardIndex === cardIndex) {
          state.tokens.pop();
          hideFeedback();
          render();
        } else {
          showFeedback(I18N[state.lang].msgCardNotLast, 'info');
        }
        return;
      }

      // If preceded by another number or ")", nudge user to choose an operator first
      if (last && (last.type === 'card' || last.type === 'rparen')) {
        showFeedback(I18N[state.lang].msgNeedOp, 'info');
        nudgeOperators();
        return;
      }

      const card = state.dealtCards[cardIndex];
      state.tokens.push({
        type: 'card',
        cardIndex,
        value: card.val,
        rank: card.rank,
        suit: card.suit
      });
      hideFeedback();
      checkProgressAndVictory();
      render();
    }

    /**
     * Left Parenthesis "(" smart input rule:
     * - Allowed at start, after "(", or after "+ − × ÷".
     * - If tapped right after a number or ")", automatically inserts "× (" for convenience!
     */
    function onLeftParenClick() {
      if (state.roundSolved) return;
      const last = state.tokens[state.tokens.length - 1];

      if (last && (last.type === 'card' || last.type === 'rparen')) {
        state.tokens.push({ type: 'op', op: '*', symbol: '×' });
      }
      state.tokens.push({ type: 'lparen' });
      hideFeedback();
      render();
    }

    /**
     * Right Parenthesis ")" smart input rule:
     * - Enabled whenever open "(" > 0 AND preceded by a number or ")".
     */
    function onRightParenClick() {
      if (state.roundSolved) return;
      const open = countOpenParens(state.tokens);
      const last = state.tokens[state.tokens.length - 1];
      if (open <= 0 || !last || (last.type !== 'card' && last.type !== 'rparen')) return;

      state.tokens.push({ type: 'rparen' });
      hideFeedback();
      checkProgressAndVictory();
      render();
    }

    /**
     * Four Arithmetic Operators (+ − × ÷):
     * - Allowed after a number or ")".
     * - Tapping an operator right after another operator smoothly replaces it!
     */
    function onOperatorClick(op) {
      if (state.roundSolved) return;
      const opSymbols = { '+': '+', '-': '−', '*': '×', '/': '÷' };
      const last = state.tokens[state.tokens.length - 1];
      if (!last) return;

      if (last.type === 'op') {
        last.op = op;
        last.symbol = opSymbols[op];
        hideFeedback();
        render();
        return;
      }

      if (last.type === 'card' || last.type === 'rparen') {
        state.tokens.push({ type: 'op', op, symbol: opSymbols[op] });
        hideFeedback();
        render();
      }
    }

    function onBackspace() {
      if (state.tokens.length === 0) return;
      state.tokens.pop();
      state.roundSolved = false;
      hideFeedback();
      render();
    }

    function onClear() {
      state.tokens = [];
      state.roundSolved = false;
      hideFeedback();
      render();
    }

    function nudgeOperators() {
      document.querySelectorAll('.op-btn').forEach((btn) => {
        btn.classList.remove('nudge-op');
        void btn.offsetWidth;
        btn.classList.add('nudge-op');
      });
    }

    function checkProgressAndVictory() {
      const evalRes = evaluateTokensWithBreakdown(state.tokens);
      const usedCount = state.tokens.filter((tk) => tk.type === 'card').length;
      const dict = I18N[state.lang];

      // Celebrate mid-game 5! = 120 bracket milestones (e.g., closing "(13 − 8)" -> 5 or "(12 + 12)" -> 24)
      const lastToken = state.tokens[state.tokens.length - 1];
      if (
        state.target === 120 &&
        lastToken &&
        lastToken.type === 'rparen' &&
        evalRes.groups &&
        evalRes.groups.length > 0 &&
        usedCount < state.cardCount
      ) {
        const latestGroup = evalRes.groups[evalRes.groups.length - 1];
        if (latestGroup.val.d === 1) {
          const v = latestGroup.val.n;
          if (v === 5) showFeedback(dict.msgBracketMade5, 'sparkle');
          else if (v === 24) showFeedback(dict.msgBracketMade24, 'sparkle');
          else if (v === 6) showFeedback(dict.msgBracketFactor(6, 20), 'sparkle');
          else if (v === 20) showFeedback(dict.msgBracketFactor(20, 6), 'sparkle');
          else if (v === 8) showFeedback(dict.msgBracketFactor(8, 15), 'sparkle');
          else if (v === 15) showFeedback(dict.msgBracketFactor(15, 8), 'sparkle');
          else if (v === 10) showFeedback(dict.msgBracketFactor(10, 12), 'sparkle');
          else if (v === 12) showFeedback(dict.msgBracketFactor(12, 10), 'sparkle');
        }
      }

      // Check automatic victory: all dealt cards used, balanced brackets, exact value === target
      if (
        usedCount === state.cardCount &&
        evalRes.status === 'OK' &&
        matchesTarget(evalRes.val, state.target)
      ) {
        if (!state.roundSolved) {
          state.roundSolved = true;
          state.solvedCount += 1;
        }
        hideFeedback();
        launchConfetti();
      }
    }

    /* ------------------------------------------------------------------------
       8. PROGRESSIVE BRACKET HINT SYSTEM
       ------------------------------------------------------------------------ */
    function showNextHint() {
      const dict = I18N[state.lang];
      if (!state.solutions || state.solutions.length === 0) {
        showFeedback(dict.hintNoSol, 'info');
        return;
      }

      const bestSol = state.solutions[0];
      // Extract parenthesized sub-expressions from the best solution
      const matches = bestSol.expr.match(/\([^()]+\)/g) || [];
      state.hintStep += 1;

      if (matches.length > 0 && state.hintStep <= matches.length) {
        const groupExpr = matches[state.hintStep - 1];
        // Evaluate that group text cleanly
        const groupVal = evaluateSimpleExprText(groupExpr);
        const clueText = groupVal !== null ? `${groupExpr} = ${groupVal}` : groupExpr;
        showFeedback(dict.hintGroup(state.hintStep, matches.length, clueText), 'sparkle');
      } else {
        showFeedback(dict.hintFull(bestSol.expr, state.target), 'sparkle');
      }
    }

    function evaluateSimpleExprText(exprStr) {
      try {
        const cleaned = exprStr
          .replace(/×/g, '*')
          .replace(/÷/g, '/')
          .replace(/−/g, '-');
        if (!/^[0-9+\-*/().\s]+$/.test(cleaned)) return null;
        const val = Function(`"use strict"; return (${cleaned});`)();
        if (typeof val === 'number' && Number.isFinite(val)) {
          return Number.isInteger(val) ? String(val) : val.toFixed(2).replace(/\.?0+$/, '');
        }
      } catch (_) {}
      return null;
    }

      const openInd = document.getElementById('open-paren-indicator');

        openInd.textContent = dict.openParenWarn(openParens);

          } else if (tk.type === 'lparen' || tk.type === 'rparen') {
            // Warm amber highlight for parentheses
            chip.className +=
              'px-2.5 py-1 rounded-xl bg-amber-100 border-2 border-amber-400 text-amber-800 text-lg sm:text-xl shadow-2xs';
            chip.textContent = tk.type === 'lparen' ? '(' : ')';

            chip.className += 'px-1.5 py-1 text-slate-700 text-lg sm:text-xl';
            chip.textContent = tk.symbol;
          }

          tokensEl.appendChild(chip);
        });
      }

      if (!state.roundSolved) {
        const cursor = document.createElement('span');
        cursor.className = 'eq-cursor inline-block w-0.5 h-6 bg-indigo-500 rounded ml-0.5';
        tokensEl.appendChild(cursor);
      }

      // Real-time Exact Rational Evaluation & Live Bracket Breakdown
      const evalRes = evaluateTokensWithBreakdown(state.tokens);
      const livePill = document.getElementById('live-result-pill');
      const liveBreakdownBar = document.getElementById('live-breakdown-bar');
      const liveBreakdownChips = document.getElementById('live-breakdown-chips');
      document.getElementById('txt-breakdown-label').textContent = dict.breakdownLabel;

      if (evalRes.status === 'EMPTY') {
        livePill.className = 'px-3 py-1 rounded-xl bg-white border border-slate-200 font-math text-xs sm:text-sm font-extrabold text-slate-400';
        livePill.textContent = '= ?';
        liveBreakdownBar.classList.add('hidden');
      } else if (evalRes.status === 'UNCLOSED') {
        livePill.className = 'px-3 py-1 rounded-xl bg-amber-50 border border-amber-300 text-xs font-extrabold text-amber-800';
        livePill.textContent = dict.liveUnclosed(evalRes.open);
        liveBreakdownBar.classList.add('hidden');
      } else if (evalRes.status === 'INCOMPLETE') {
        livePill.className = 'px-3 py-1 rounded-xl bg-white border border-slate-200 text-xs font-extrabold text-slate-500';
        livePill.textContent = dict.liveIncomplete;
        liveBreakdownBar.classList.add('hidden');
      } else if (evalRes.status === 'DIV_ZERO') {
        livePill.className = 'px-3 py-1 rounded-xl bg-rose-50 border border-rose-300 text-xs font-extrabold text-rose-700';
        livePill.textContent = dict.liveDivZero;
        liveBreakdownBar.classList.add('hidden');
      } else if (evalRes.status === 'OK') {
        const isTargetMatch = matchesTarget(evalRes.val, state.target);
        const cardsLeft = state.cardCount - usedCount;

        if (isTargetMatch && cardsLeft === 0) {
          livePill.className = 'px-3 py-1 rounded-xl bg-emerald-600 text-white font-math text-xs sm:text-sm font-extrabold';
          livePill.textContent = `= ${evalRes.valStr} ✓`;
        } else if (isTargetMatch && cardsLeft > 0) {
          livePill.className = 'px-3 py-1 rounded-xl bg-amber-100 border border-amber-400 text-amber-900 font-math text-xs font-extrabold';
          livePill.textContent = `= ${evalRes.valStr} ${dict.liveCardsLeft(cardsLeft)}`;
        } else {
          livePill.className = 'px-3 py-1 rounded-xl bg-white border border-indigo-200 text-indigo-900 font-math text-xs sm:text-sm font-extrabold';
          livePill.textContent = `= ${evalRes.valStr}`;
        }

        // Show live evaluated bracket groups (e.g. "(13 − 8) = 5")
        if (evalRes.groups && evalRes.groups.length > 0) {
          liveBreakdownBar.classList.remove('hidden');
          liveBreakdownChips.innerHTML = evalRes.groups
            .map(
              (g) =>
                `<span class="px-2 py-0.5 rounded-lg bg-amber-100 border border-amber-300 font-math font-extrabold text-amber-950">${g.expr} = ${g.valStr}</span>`
            )
            .join('');
        } else {
          liveBreakdownBar.classList.add('hidden');
        }
      }

      // Victory Banner & Bracket Breakdown
      const victoryBanner = document.getElementById('victory-banner');
      if (state.roundSolved && evalRes.status === 'OK') {
        victoryBanner.classList.remove('hidden');
        document.getElementById('txt-win-title').textContent = dict.winTitle(state.target);
        document.getElementById('txt-win-eq').textContent = `${evalRes.fullText} = ${evalRes.valStr}`;
        document.getElementById('txt-next-hand').textContent = dict.nextHand;

        // Check if 120 factorial grouping was used
        const usedFactorialGroup =
          state.target === 120 &&
          evalRes.groups.some(
            (g) => g.val.d === 1 && [5, 24, 6, 20, 8, 15, 10, 12].includes(g.val.n)
          );
        const factBadge = document.getElementById('win-factorial-badge');
        factBadge.textContent = dict.winFactorialBadge;
        factBadge.classList.toggle('hidden', !usedFactorialGroup);

        // Victory Bracket Breakdown
        const winBreakdownBox = document.getElementById('win-breakdown-box');
        if (evalRes.groups.length > 0) {
          winBreakdownBox.classList.remove('hidden');
          const parts = evalRes.groups.map((g) => `${g.expr} = ${g.valStr}`).join(' ， ');
          document.getElementById('win-breakdown-text').textContent = `${parts}  →  ${evalRes.fullText} = ${evalRes.valStr}`;
        } else {
          winBreakdownBox.classList.add('hidden');
        }
      } else {
        victoryBanner.classList.add('hidden');
      }

      // Keypad Button States & Labels
      document.getElementById('txt-lparen-sub').textContent = dict.lparenSub;
      document.getElementById('txt-rparen-sub').textContent = dict.rparenSub;
      document.getElementById('txt-backspace').textContent = dict.backspace;
      document.getElementById('txt-clear').textContent = dict.clear;
      document.querySelectorAll('.op-sub').forEach((el, i) => {
        el.textContent = dict.opSubs[i];
      });

      const canCloseParen =
        !state.roundSolved &&
        openParens > 0 &&
        lastToken &&
        (lastToken.type === 'card' || lastToken.type === 'rparen');

      const rparenBtn = document.getElementById('btn-rparen');
      const rparenBadge = document.getElementById('rparen-badge');
      rparenBtn.disabled = !canCloseParen;
      if (openParens > 0) {
        rparenBadge.textContent = openParens;
        rparenBadge.classList.remove('hidden');
      } else {
        rparenBadge.classList.add('hidden');
      }

      document.getElementById('btn-lparen').disabled = state.roundSolved;

      const canPressOp =
        !state.roundSolved &&
        lastToken &&
        (lastToken.type === 'card' || lastToken.type === 'rparen' || lastToken.type === 'op');
      document.querySelectorAll('.op-btn').forEach((btn) => {
        btn.disabled = !canPressOp;
      });

      document.getElementById('btn-backspace').disabled = state.tokens.length === 0;
      document.getElementById('btn-clear').disabled = state.tokens.length === 0;

      // Hint & Multiple Solutions Controls
      document.getElementById('txt-hint').textContent = dict.hint;
      document.getElementById('txt-auto-solutions').textContent = dict.autoSolutions;
      document.getElementById('txt-toggle-solutions').textContent = state.solutionsVisible
        ? dict.hideSolutions
        : dict.showSolutions;

      renderSolutionsList(dict);
    }

    /* ------------------------------------------------------------------------
       10. CELEBRATION CONFETTI & OFFLINE DOWNLOAD
       ------------------------------------------------------------------------ */
    function launchConfetti() {
      const canvas = document.getElementById('confetti-canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const colors = ['#4F46E5', '#D97706', '#059669', '#F59E0B', '#6366F1'];
      const particles = Array.from({ length: 85 }, () => ({
        x: canvas.width * 0.5 + (Math.random() - 0.5) * 260,
        y: canvas.height * 0.42,
        vx: (Math.random() - 0.5) * 14,
        vy: -Math.random() * 13 - 4,
        size: Math.random() * 8 + 4,
        color: colors[Math.floor(Math.random() * colors.length)],
        rot: Math.random() * 360,
        vRot: (Math.random() - 0.5) * 12
      }));

      let frame = 0;
      function tick() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach((p) => {
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.42;
          p.rot += p.vRot;
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate((p.rot * Math.PI) / 180);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.65);
          ctx.restore();
        });
        if (++frame < 75) requestAnimationFrame(tick);
        else ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
      requestAnimationFrame(tick);
    }

    function downloadOfflineHtml() {
      const blob = new Blob([CLEAN_HTML_SNAPSHOT], { type: 'text/html;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'poker-120-bracket-math.html';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showFeedback(I18N[state.lang].msgDownloaded, 'sparkle');
    }

       11. EVENT LISTENERS & KEYBOARD SHORTCUTS
       ------------------------------------------------------------------------ */

      state.deck = createShuffledDeck();

      // Card count buttons (3, 4, 5, 6)
      document.querySelectorAll('.count-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          state.cardCount = Number(btn.dataset.count);
          dealNewCards();
        });
      });

      targetInput.addEventListener('change', () => {
        const val = Number(targetInput.value);

          state.target = val;
          dealNewCards();
        }
      });

      document.querySelectorAll('.target-chip').forEach((chip) => {

          targetInput.value = state.target;
          dealNewCards();

      document.getElementById('btn-random-target').addEventListener('click', () => {

        state.target = next;
        targetInput.value = next;

      // Deal & Next Hand

      document.getElementById('btn-rparen').addEventListener('click', onRightParenClick);
      document.querySelectorAll('.op-btn').forEach((btn) => {

      });

      document.getElementById('btn-clear').addEventListener('click', onClear);

        state.solutionsVisible = !state.solutionsVisible;

      document.getElementById('btn-lang').addEventListener('click', () => {
        state.lang = state.lang === 'zh' ? 'en' : 'zh';
        render();
      });
      document.getElementById('btn-download').addEventListener('click', downloadOfflineHtml);

      // Convenient keyboard shortcuts for brackets, operators & backspace
      window.addEventListener('keydown', (e) => {
        if (document.activeElement === targetInput) return;
        if (e.key === '(') {
          e.preventDefault();
          onLeftParenClick();
        } else if (e.key === ')') {
          e.preventDefault();
          onRightParenClick();
        } else if (['+', '-', '*', '/'].includes(e.key)) {
          e.preventDefault();
          onOperatorClick(e.key);
        } else if (e.key === 'Backspace') {
          e.preventDefault();
          onBackspace();
        } else if (e.key === 'Escape') {
          e.preventDefault();
          onClear();
        }
      });

      // Deal initial solvable 5-card hand targeting 120
      dealNewCards();
    });
  </script>
</body>
</html>
